[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sage-agent"
version = "0.1.0"
description = "SAGE-Agent: Structured Uncertainty Guided Clarification for LLM Agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "SAGE-Agent Contributors" }
]
keywords = [
    "llm",
    "agent",
    "uncertainty",
    "clarification",
    "pomdp",
    "tool-calling",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
# LangGraph integration
langgraph = [
    "langgraph>=0.0.30",
    "langchain-core>=0.1.0",
]

# OpenRouter client
openrouter = [
    "openai>=1.0.0",
]

# TTS service client
tts = [
    "llm-tts>=0.1.0",
    "langchain-core>=0.1.0",
]

# GRPO training
training = [
    "torch>=2.0",
    "transformers>=4.30",
]

# All optional dependencies
all = [
    "sage-agent[langgraph,openrouter,tts,training]",
]

# Development dependencies
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "mypy>=1.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/sage-agent"
Documentation = "https://github.com/yourusername/sage-agent#readme"
Repository = "https://github.com/yourusername/sage-agent"
Issues = "https://github.com/yourusername/sage-agent/issues"

[tool.hatch.build.targets.wheel]
packages = ["sage_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]
