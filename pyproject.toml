[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trajectory-uq-toolkit"
version = "0.1.0"
description = "Portable trajectory collection and UQ/Bayesian analysis toolkit"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
test = ["pytest>=8"]
code = [
    "datasets>=2",
    "docker>=7",
    "evalplus>=0.3",
    "huggingface-hub>=0.24",
    "langchain-core>=0.1",
    "langgraph>=0.0.30",
    "openai>=1",
    "pandas>=2",
    "pyarrow>=15",
    "pydantic>=2",
    "python-dotenv>=1",
    "ruff>=0.5",
    "scipy>=1.11",
    "tqdm>=4",
]
swe = ["swebench>=3"]

[project.scripts]
trajectory-uq-collect = "trajectory_uq_toolkit.collect:main"
trajectory-uq-analyze = "trajectory_uq_toolkit.analyze:main"
code-uq-run = "code_uq.agents.lcb_llm_tool_agent:main"
code-uq-analyze-logs = "code_uq.analysis.analyze_lcb_llm_tool_agent_logs:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
